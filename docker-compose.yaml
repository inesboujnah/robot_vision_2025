version: "3"
services:
  orb_slam3_22_humble:
    image: orb-slam3-humble:22.04
    volumes:
      #full dev
      - /dev:/dev:rw
      #full media
      - /media:/media:rw
      #Time
      - /etc/timezone:/etc/timezone:rw
      - /etc/localtime:/etc/localtime:rw
      #ros-workspaces
      - ./container_root/:/root/
      - ./ros_env_vars.sh:/root/ros_env_vars.sh
      - ./orb_slam3_ros2_wrapper/:/root/colcon_ws/src/orb_slam3_ros2_wrapper/
      - ./orb_slam3_map_generator/:/root/colcon_ws/src/orb_slam3_map_generator/
      - ./slam_msgs/:/root/colcon_ws/src/slam_msgs/
      - ./ORB_SLAM3/:/home/orb/ORB_SLAM3/
    privileged: true
    network_mode: host
    ipc: host
    pid: host
    stdin_open: true
    tty: true
    environment:
      - DISPLAY
    entrypoint: /bin/bash

  realsense:
    image: realsense:local
    environment:
      - RECORD_BAG=1
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
      # Optional: set BAG_OPTS or BAG_DIR if needed
      # - BAG_OPTS=--compression lz4
      # - BAG_DIR=/root/memory_register/realsense
    volumes:
      - ./memory_register/realsense:/root/memory_register/realsense
    network_mode: host
    privileged: true
    stdin_open: true
    tty: true

  oak:
    image: oak_realsense:local
    environment:
      - RECORD_BAG=1
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
      # Optional: set BAG_OPTS or BAG_DIR if needed
      # - BAG_OPTS=--compression lz4
      # - BAG_DIR=/root/memory_register/oak
    volumes:
      - ./memory_register/oak:/root/memory_register/oak
    network_mode: host
    privileged: true
    stdin_open: true
    tty: true
