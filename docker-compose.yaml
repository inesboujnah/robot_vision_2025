version: "3"
services:

  orbslam3:
    image: rv_base:v1
    shm_size: '2gb'
    environment:
      - DISPLAY
      - QT_X11_NO_MITSHM=1
      - BAG=bags
      - MODE=stereo
      - CAMERA=oak
      - DO_RECTIFY=true
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../memory_register/orbslam_data/trajectory:/root/memory_register/orb_slam_data/trajectory
      - ../memory_register/orbslam_data/map:/root/memory_register/orb_slam_data/map
    network_mode: host
    stdin_open: true
    tty: true