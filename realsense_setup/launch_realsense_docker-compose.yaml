version: '3.7'
services:

  realsense:
    image: rv_realsense:v1
    shm_size: '4gb'
    environment:
      - RECORD_BAG=0
      - LAUNCH_NODE=1
      - MODE=stereo
      - DISPLAY
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../memory_register/realsense:/root/memory_register/realsense
      - /dev:/dev
    network_mode: host
    privileged: true
    stdin_open: true
    tty: true
