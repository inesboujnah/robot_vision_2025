version: "2.3"
services:

  orbslam3:
    image: rv_orbslam:v1
    shm_size: '4gb'
    runtime: nvidia
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XDG_RUNTIME_DIR=/tmp/runtime-root
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - NO_AT_BRIDGE=1
      - BAG=oak_stereo-inertial_2025-12-18_17-19-14
      - MODE=stereo-inertial
      - CAMERA=oak
      - DO_RECTIFY=false
      - FROM_BAG=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev/dri:/dev/dri
      # - ../../robot_vision_2025:/root/robot_vision_2025:rw
      - ../memory_register/orbslam_data/trajectory:/root/memory_register/orbslam_data/trajectory
      - ../memory_register/orbslam_data/map:/root/memory_register/orbslam_data/map
      - ../memory_register/oak:/root/memory_register/oak
      - ../memory_register/realsense:/root/memory_register/realsense
    network_mode: host
    stdin_open: true
    tty: true