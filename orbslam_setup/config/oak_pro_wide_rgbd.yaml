%YAML:1.0

#--------------------------------------------------------------------------------------------
# Camera Parameters. Adjusted for OAK-D RGB-D (Rectified)
# Source: /oak/rgb/camera_info
#--------------------------------------------------------------------------------------------
File.version: "1.0"

System.SaveAtlasToFile: "memory_register/orbslam_data/map/oak_pro_wide_rgbd"

Camera.type: "PinHole"

# RGB Camera calibration (Camera1)
# Values taken from the P matrix (rectified intrinsics)
Camera1.fx: 422.12198
Camera1.fy: 422.12198
Camera1.cx: 317.35858
Camera1.cy: 195.84804
Camera1.k1: 0.0
Camera1.k2: 0.0
Camera1.p1: 0.0
Camera1.p2: 0.0

# Camera resolution
Camera.width: 640
Camera.height: 400

# Camera frames per second 
Camera.fps: 30

# Color order of the images (0: BGR, 1: RGB)
Camera.RGB: 1

# Close/Far threshold. Baseline times.
# Points further than (Baseline * 40) are treated as "Far" (Monocular observation)
Stereo.ThDepth: 40.0

# Stereo Baseline (in meters)
# Standard OAK-D baseline is 7.5cm. Keep this unless you have a custom mount.
Stereo.b: 0.075

# Depth map values factor
# 1000.0 is correct if depth is in millimeters (standard OAK-D behavior)
RGBD.DepthMapFactor: 1000.0

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------
# ORB Extractor: Number of features per image
ORBextractor.nFeatures: 1500

# ORB Extractor: Scale factor between levels in the scale pyramid 	
ORBextractor.scaleFactor: 1.2

# ORB Extractor: Number of levels in the scale pyramid	
ORBextractor.nLevels: 8

# ORB Extractor: Fast threshold
# Image is divided in a grid. At each cell FAST are extracted imposing a minimum response.
# Firstly we impose iniThFAST. If no corners are detected we impose a lower value minThFAST
# You can lower these values if your images have low contrast			
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -3.5
Viewer.ViewpointF: 500.0