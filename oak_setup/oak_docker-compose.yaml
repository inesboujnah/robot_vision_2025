version: "3"
services:

  oak:
    image: rv_oak:v1
    shm_size: '2gb'
    environment:
      - RECORD_BAG=0
      - MODE=stereo
      - DISPLAY
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../memory_register/oak:/root/memory_register/oak
      - ../memory_register/orbslam_data:/root/memory_register/orb_slam_data
      - /dev:/dev
    network_mode: host
    privileged: true
    stdin_open: true
    tty: true

