version: "3.7"
services:

  oak:
    image: rv_oak:humble
    shm_size: '4gb'
    stop_signal: SIGINT
    environment:
      - RECORD_BAG=1
      - MODE=stereo-inertial
      - DISPLAY
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../memory_register/oak:/root/memory_register/oak
      - /dev:/dev
    network_mode: host
    privileged: true
    stdin_open: true
    tty: true
