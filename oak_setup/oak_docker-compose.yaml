version: "3"
services:

  oak:
    image: rv_oak:v1
    environment:
      - RECORD_BAG=0
    volumes:
      - ../memory_register/oak:/root/memory_register/oak
      - ../memory_register/orbslam_data:/root/memory_register/orb_slam_data
    network_mode: host
    privileged: true
    stdin_open: true
    tty: true
